<!doctype html>

  <head>
    <!-- Monetag In-Page Push (zone 11640179) — DORMANT-SAFE ad-free gate.
         Mirrors src/utils/adFree.ts (asserted by scripts/test-ad-guard.mjs).
         The tag loads ONLY for web visitors without an active Yodoku+ state.
         The native app (window.Capacitor / https://localhost origin) and
         ?native=1 / ?plus=1 overrides never load it. Ordinary web traffic is
         unchanged — the same tag, the same zone, at the same point in <head>. -->
    <script>(function () {
  var ZONE = '11640179';
  var SRC = 'https://nap5k.com/tag.min.js';
  function adFree() {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('native') === '1') return true;                              // ?native=1 simulation
      if (q.get('plus') === '1') return true;                                // ?plus=1 subscriber
      if (localStorage.getItem('yodoku_plus_local') === '1') return true;    // stored Yodoku+
    } catch (e) { /* no window APIs — treat as plain web */ }
    var cap = window.Capacitor;
    if (cap) {
      if (typeof cap.isNativePlatform === 'function') {
        if (cap.isNativePlatform()) return true;
      } else if (typeof cap.platform === 'string' && cap.platform !== 'web') {
        return true;
      }
    }
    if (location.protocol === 'https:' && location.hostname === 'localhost' && location.port === '') return true; // native WebView origin
    return false;
  }
  if (adFree()) return;
  var s = document.createElement('script');
  s.dataset.zone = ZONE, s.src = SRC;
  ([document.documentElement, document.body].filter(Boolean).pop() || document.head).appendChild(s);
})();</script>

    <!-- Boot loader (native app only, or ?loader=1 for preview). Dormant-safe: hidden on the plain web. -->
    <style id="boot-css">
      html.yk-boot { background: #141414; }
      #boot-loader[hidden] { display: none; }
      #boot-loader {
        position: fixed; inset: 0; z-index: 2147483000;
        background: #141414;
        display: flex; align-items: center; justify-content: center;
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .bl-inner { display: flex; flex-direction: column; align-items: center; transform: translateY(-5vh); }
      .bl-logo { animation: bl-bob 2.4s ease-in-out infinite; }
      .bl-word { color: #f6f3ec; font-weight: 900; font-size: 22px; letter-spacing: 0.34em; margin-left: 0.34em; margin-top: 12px; }
      .bl-sub { color: #7d7d7d; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; letter-spacing: 0.42em; margin-left: 0.42em; margin-top: 4px; }
      .bl-tiles { display: flex; gap: 6px; margin-top: 26px; }
      .bl-tile {
        width: clamp(34px, 10.5vw, 42px); height: clamp(34px, 10.5vw, 42px);
        border-radius: 10px; background: #f6f3ec; border: 2.5px solid #141414;
        box-shadow: 0 3px 0 var(--s);
        display: grid; place-items: center;
        font-size: clamp(15px, 4.8vw, 19px); line-height: 1;
        opacity: 0; transform: translateY(14px) scale(0.5) rotate(-8deg);
        animation: bl-pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) forwards, bl-wave 1.6s ease-in-out infinite;
        animation-delay: var(--d), calc(var(--d) + 0.5s);
      }
      .bl-hint { display: flex; align-items: center; gap: 2px; color: #9a9a9a; font-size: 12px; font-weight: 600; margin-top: 26px; }
      .bl-dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #d9f24b; margin-left: 4px; animation: bl-dot 1.2s ease-in-out infinite; }
      .bl-dots i:nth-child(2) { animation-delay: 0.15s; }
      .bl-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bl-pop { to { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); } }
      @keyframes bl-wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes bl-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes bl-dot { 0%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }
      #boot-loader.boot-out { opacity: 0; transition: opacity 0.28s ease; }
      @media (prefers-reduced-motion: reduce) {
        .bl-logo, .bl-dots i { animation: none; }
        .bl-tile { animation: none; opacity: 1; transform: none; }
      }
    </style>
    <script>
      /* Boot timing + native detection (same signals as the ad guard). */
      window.__bootStart = Date.now();
      (function () {
        var show = false;
        try {
          var q = new URLSearchParams(location.search);
          if (q.get('loader') === '1' || q.get('native') === '1') show = true;
          window.__bootKeep = q.get('loader') === '1';
        } catch (e) { }
        var cap = window.Capacitor;
        if (cap) {
          if (typeof cap.isNativePlatform === 'function') { if (cap.isNativePlatform()) show = true; }
          else if (typeof cap.platform === 'string' && cap.platform !== 'web') { show = true; }
        }
        if (location.protocol === 'https:' && location.hostname === 'localhost' && location.port === '') show = true;
        if (show) {
          document.documentElement.classList.add('yk-boot');
          window.__bootShow = true;
        }
      })();
    </script>
  </head>

        </div>
        <div class="bl-hint">Loading today’s puzzles<span class="bl-dots"><i></i><i></i><i></i></span></div>

        if (bl) bl.hidden = false;
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
